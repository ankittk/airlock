# Minimal promptfoo fixture
prompts:
  - "Say hello"
providers:
  - mock
tests:
  - description: hello-json
    vars:
      query: "ping"
    assert:
      - type: is-json
  - description: hello-contains
    vars:
      query: "exact:{\"ok\":true,\"answer\":\"mock\"}"
    assert:
      - type: contains
        value: "ok"
