name: Bug report
description: Something broken in the CLI or libraries
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security** issues use private reporting — see SECURITY.md.
  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Exact commands and fixture paths
      placeholder: |
        go build -o airlock ./cmd/airlock
        ./airlock …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: airlock version / go version
      placeholder: airlock 0.1.0-beta.1 / go1.25.9
    validations:
      required: true
